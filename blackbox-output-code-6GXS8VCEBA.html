<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, button { padding: 10px; margin: 5px; }
        #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 100px; }
    </style>
</head>
<body>
    <h1>AI Text Generator</h1>
    <input type="text" id="prompt" placeholder="Masukkan prompt Anda" />
    <button onclick="generateAI()">Generate AI</button>
    <div id="output"></div>

    <script>
        async function generateAI() {
            const prompt = document.getElementById('prompt').value;
            const apiKey = 'YOUR_API_KEY'; // Ganti dengan API key Hugging Face
            const model = 'gpt2'; // Model sederhana, bisa ganti dengan yang lain

            const response = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ inputs: prompt })
            });

            const data = await response.json();
            document.getElementById('output').innerText = data[0]?.generated_text || 'Error: Gagal generate.';
        }
    </script>
</body>
</html>
